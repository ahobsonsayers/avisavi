name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Branch, tag or commit hash
        type: string
        required: true
        default: main
      default-bump:
        description: Default Version Bump (if none found in commit messages)
        type: choice
        options:
          - major
          - minor
          - patch
        required: false
        default: patch

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}

      - name: Create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event.inputs.default-bump }}
          create_annotated_tag: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.new_tag }}
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true

    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        id: build
        run: |
          BINARY_NAME="avisavi-$GOOS-$GOARCH"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="$BINARY_NAME.exe"
          fi

          go build \
            -ldflags "-X github.com/ahobsonsayers/avisavi/pkg/gavios/auth.defaultClientID=$AVIOS_AUTH_CLIENT_ID" \
            -o "./bin/$BINARY_NAME" \
            ./cmd/avisavi

          echo "binary-name=$BINARY_NAME" >> "$GITHUB_OUTPUT"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          AVIOS_AUTH_CLIENT_ID: ${{ secrets.AVIOS_AUTH_CLIENT_ID }}

      - name: Upload binary
        run: |
          gh release upload "$TAG" "./bin/$BINARY_NAME" --clobber
        env:
          BINARY_NAME: ${{ steps.build.outputs.binary-name }}
          TAG: ${{ needs.create-release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
